name: Build Android APK (s-ui Client)

# 在 GitHub 的免费 Linux 虚拟机上用 buildozer 编译 APK。
# 本机（纯 Windows、无 WSL/Docker）无法编译，所以走云端。
on:
  workflow_dispatch:   # 可在 Actions 页面手动点 “Run workflow” 触发
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360   # 首次要下载 SDK/NDK 并交叉编译，给足时间
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev

      - name: Install buildozer
        run: pip install --upgrade pip buildozer

      # 假设本仓库根目录就是 android/ 文件夹的内容
      # （main.py、suicore.py、buildozer.spec、icon.png、presplash.png、.github/）。
      # 如果你是把整个 s-ui-client 作为仓库，请：
      #   1) 本步骤加一行  working-directory: android
      #   2) 下方 Upload 的 path 改成  android/bin/*.apk
      - name: Build debug APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sui-client-apk
          path: bin/*.apk
          if-no-files-found: error
